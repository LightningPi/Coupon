<script type="text/javascript">  //這頁專用的javascript語法，需包在page的div裡。
 
  
  $(document).ready(function(){

		document.getElementById("nomember").style.display = "";
		document.getElementById("member").style.display = "none";

	}else{

		document.getElementById("nomember").style.display = "none";
		document.getElementById("member").style.display = "";

	}
	

	
  });	


					 
</script>  <!--這頁專用的javascript語法結尾-->
