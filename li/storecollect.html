<!DOCTYPE html><!--HTML 5宣告-->
<html>
<head>

  <meta http-equiv="Content-Language" content="zh-tw">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1,  width=device-width;" /><!--initial-scale=1表示螢幕初始大小為100%。maximum-scale=1表示螢幕最大為100%。minimum-scale=1表示螢幕最小為100%(不可縮)。 width這邊的設定為依照裝置螢幕的大小而調整。-->

  <link rel="stylesheet" type="text/css" href="../jquery.mobile-1.2.0.min.css" /> <!--引用jquery-mobile的css-->      
  <script type="text/javascript" src="../cordova-2.0.0.js"></script> <!--引用phonegap的javascript-->
  <script type="text/javascript" src="../jquery-1.8.2.min.js"></script> <!--引用jquery的javascript-->
  <script type="text/javascript" src="../jquery.mobile-1.2.0.min.js"></script> <!--引用jquery.mobile的javascript-->

	<!--一起用的javascript css放在<head>和</head>裡-->

  <title></title><!--這個設定在手機上沒效果-->
</head>

<body>

<div data-role="page"  data-add-back-btn="true" id="page"><!--手機分上、中、下三區塊，這三個區塊放在這個div裡面。data-add-back-btn用來設定回上一頁按鈕(不加或沒有上一頁時，則不會顯示此按鈕)。id可以自己命名。此頁專用的javascript css放在這個div裡。-->
<script type="text/javascript">  //這頁專用的javascript語法，需包在page的div裡。
    $(document).ready(function(){  //這一行是指當整個網頁檔案都載入時，才會執行此function

	if(sessionStorage.getItem('memberid')==null){	//登入驗證 如果session memberid不存在 = 未登入

			document.location.href="login.html";// 未登入，回登入頁
		
	}else{
	
		var memberid = sessionStorage.getItem('memberid');//接收login頁面的memberid session
      
      $.ajax({  //用ajax接收
        url:'http://伺服器IP/app_php/store_collect.php?mid='+memberid+'',  //接收的php檔案網址
        dataType:'jsonp',  //以jsonp方式接收
        jsonp:'jsoncallback',  //接收php檔案內jsoncallback的值
        timeout:5000,
        success:function(data,status){  //成功時跑的function
          $.each(data,function(i,item){ //用迴圈逐一傳入物件各屬性的名稱(i),及值(item)給callback函數處理。其中item很重要，下面注意的地方會解釋。
           
			var out='<li><a href="../store_context.html" onclick="storecontext('+item.store_id+')">'  //設定out變數的內容。注意：item.資料庫欄位名稱(如name)，就會把name欄位的值加進來(欄位名稱需在php檔中，有從資料庫撈出來的才有用)。+是連接符號，和java一樣，這邊+號這麼多是在設定它顯示的方式。
				+'<img src="'+item.pic+'" height="200%" width="150%" />'          //這邊都是jquery-mobile的語法，下方ul中需要包li，其他標籤為每個li裡的標籤
				+'<h3>'+item.name+'</h3>' 
				+'<p>電話：'+item.tel+'</p>'
				+'<p>地址：'+item.address+'</p>'
				+'</a><a href="delete_store.html" onclick="deletestore('+item.store_id+')">刪除收藏</a>'
			    +'</li>';
            
			$('#storecollect').append(out);   //#storecollect是找id為storecollect的標籤(下方有個ul標籤的id為storecollect)。.append(out)是把out的內容接到id為storecollect的標籤裡     
          });
		  $('#storecollect').listview('refresh');//上方加入多個li後，需要重整頁面才會正常顯示，這行一定要有。
        },
        error:function(){ //錯誤時跑的function
        storecollect.text('There was an error loading the data.');  //出錯時顯示的文字
        }
      });


	}	//else結尾
	

    });
	
	function storecontext(sid){
		sessionStorage.setItem('sid',sid);//設定店家主鍵sid session，供store_context.html使用
		//localStorage.setItem("tid",sid);
		}

	function deletestore(deletestore){
		sessionStorage.setItem('deletestore',deletestore);//設定刪除已收藏商店 deletestore session，供delete_store.html使用
		//localStorage.setItem("tid",sid);
		}

		


	
</script>  <!--這頁專用的javascript語法結尾-->
	
  <div data-role="header"   data-position="fixed"><!--上方區塊div-->

    <h1>收藏商家</h1> <!--固定要用h1-->

  </div><!--上方區塊結束-->
  
  <div data-role="content"><!--中間區塊div (程式主要內容)-->

	<p>搜尋商家：</p>

    <div>  
      <ul id="storecollect" data-role="listview" data-filter="true" data-split-icon="delete" data-split-theme="d"> <!--id為storecollect的標籤，其他屬性設定是jquery-mobile的列表語法-->
    
    
      </ul>  <!--id為storecollect的標籤結尾-->   
    </div> 
  
  </div><!--中間區塊結束-->
  
  <div data-role="footer" data-position="fixed"><!--下方區塊div-->
    	
		<center>
			<a href="logout.html" data-role="button" data-theme="a" data-inline="true">登出</a>
			<a href="../storelist.html" data-role="button" data-theme="a" data-inline="true">商家列表</a>
		</center>
		
		<!--固定要用h4-->

  </div><!--下方區塊結束-->
  
</div> 



</body>
</html>
