<!DOCTYPE html><!--HTML 5宣告-->
<html>
<head>

  <meta http-equiv="Content-Language" content="zh-tw">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1,  width=device-width;" /><!--initial-scale=1表示螢幕初始大小為100%。maximum-scale=1表示螢幕最大為100%。minimum-scale=1表示螢幕最小為100%(不可縮)。 width這邊的設定為依照裝置螢幕的大小而調整。-->

  <link rel="stylesheet" type="text/css" href="../jquery.mobile-1.2.0.min.css" /> <!--引用jquery-mobile的css-->      
  <script type="text/javascript" src="../cordova-2.0.0.js"></script> <!--引用phonegap的javascript-->
  <script type="text/javascript" src="../jquery-1.8.2.min.js"></script> <!--引用jquery的javascript-->
  <script type="text/javascript" src="../jquery.mobile-1.2.0.min.js"></script> <!--引用jquery.mobile的javascript-->

	<!--一起用的javascript css放在<head>和</head>裡-->

  <title></title><!--這個設定在手機上沒效果-->
</head>

<body>


<div data-role="page"  data-add-back-btn="true" id="page"><!--手機分上、中、下三區塊，這三個區塊放在這個div裡面。data-add-back-btn用來設定回上一頁按鈕(不加或沒有上一頁時，則不會顯示此按鈕)。id可以自己命名。此頁專用的javascript css放在這個div裡。-->

<script type="text/javascript">  //這頁專用的javascript語法，需包在page的div裡。


	$(document).ready(function(){  //這一行是指當整個網頁檔案都載入時，才會執行此function

	$("#rsform").submit(function(){	//當按下確定送出按鈕時，執行rs() function

			rs();
			return false;
					});

	});

	function rs(){

		var rs_name = $("#rs_name").val();	//讀取稱呼輸入值

		var rs_email = $("#rs_email").val();	//讀取信箱輸入值

		var rs_title = $("#rs_title").val();	//讀取標題輸入值

		var rs_content = $("#rs_content").val();	//讀取內容輸入值

		if(rs_name == ""){		//如果稱呼為空值，提示請輸入稱呼

			$("#rs_check").text("請輸入稱呼");
			$("#rs_name").focus();
			return false;
		
			}
	
		if(rs_email == ""){		//如果信箱為空值，提示請輸入信箱

			$("#rs_check").text("請輸入信箱");
			$("#rs_email").focus();
			return false;

			}

		if(rs_title == ""){		//如果標題為空值，提示請輸入標題

			$("#rs_check").text("請輸入標題");
			$("#rs_title").focus();
			return false;
		
			}

		if(rs_content == ""){		//如果內容為空值，提示請輸入內容

			$("#rs_check").text("請輸入內容");
			$("#rs_content").focus();
			return false;
		
			}
	
	

	$.ajax({  //用ajax接收

        url:'http://伺服器IP/app_php/report_store.php?rs_name='+rs_name+'&rs_email='+rs_email+'&rs_title='+rs_title+'&rs_content='+rs_content+'',  //接收的php檔案網址，以GET傳送稱呼、信箱、標題、內容輸入值
        dataType:'jsonp',  //以jsonp方式接收
        jsonp:'jsoncallback',  //接收php檔案內jsoncallback的值
        timeout:5000,
        success:function(data,status){  //成功時跑的function

          $.each(data,function(i,item){ //用迴圈逐一傳入物件各屬性的名稱(i),及值(item)給callback函數處理。其中item很重要，下面注意的地方會解釋。
            
			var rs_out='<p>'+item.rsgood+'</p>';      //成功時，伺服器回傳：回報成功
            
			$('#rs_check').empty();
			$('#rs_result').empty();
			$('#rs_result').append(rs_out);   //#rs_result是找id為rs_result的標籤(下方有個標籤的id為rs_result)。.append(registerout)是把registerout的內容接到id為report_result的標籤裡   


          });
		  
        },
        error:function(){ //錯誤時跑的function
        rs_check.text('There was an error loading the data.');  //出錯時顯示的文字
        }
      });





	}

		
</script>  <!--這頁專用的javascript語法結尾-->     

	
	
  <div data-role="header"   data-position="fixed"><!--//上方區塊div-->

    <h1>聯絡我們</h1> <!--固定要用h1-->

  </div><!--上方區塊結束-->
  
  <div data-role="content"><!--//中間區塊div (程式主要內容)-->

	<p>對於商家內容及提供的優惠資訊有任何疑問，都歡迎與我們聯絡，並留下您的信箱，我們會將問題反映給商家，並做出回覆及修正。</p>

	<form id="rsform" name="rsform">
	
		<label for="rs_name">稱呼：</label>
		<input type="text" name="rs_name" id="rs_name" value="" />
		
	        <label for="rs_email">信箱：</label>
	        <input type="text" name="rs_email" id="rs_email" value="" />
	
		<label for="rs_title">標題：</label>
		<input type="text" name="rs_title" id="rs_title" value="" />

		<label for="rs_content">內容：</label>
		<textarea name="rs_content" id="rs_content"></textarea>
		
		<button type="submit" data-theme="c" name="rs_submit" id="rs_submit">確定送出</button>
  
	</form>	

	<div id="rs_result">


	</div>

	<div id="rs_check">


	</div>
  

  
  </div><!--中間區塊結束-->
  
  <div data-role="footer" data-position="fixed"><!--//下方區塊div-->
    <h4></h4> <!--固定要用h4-->

  </div><!--下方區塊結束-->
  
</div> 

</body>
</html>
