<!DOCTYPE html><!--HTML 5宣告-->
<html> 
<head>
  <meta http-equiv="Content-Language" content="zh-tw">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1,  width=device-width;" /><!--initial-scale=1表示螢幕初始大小為100%。maximum-scale=1表示螢幕最大為100%。minimum-scale=1表示螢幕最小為100%(不可縮)。 width這邊的設定為依照裝置螢幕的大小而調整。-->

  <link rel="stylesheet" type="text/css" href="../jquery.mobile-1.2.0.min.css" /> <!--引用jquery-mobile的css-->      
  <script type="text/javascript" src="../cordova-2.0.0.js"></script> <!--引用phonegap的javascript-->
  <script type="text/javascript" src="../jquery-1.8.2.min.js"></script> <!--引用jquery的javascript-->
  <script type="text/javascript" src="../jquery.mobile-1.2.0.min.js"></script> <!--引用jquery.mobile的javascript-->

	<!--一起用的javascript css放在<head>和</head>裡-->	
	
	
  <title></title><!--這個設定在手機上沒效果-->
</head>

<body>

	//集券冊

<div data-role="page"  data-add-back-btn="true" id="page"><!--手機分上、中、下三區塊，這三個區塊放在這個div裡面。data-add-back-btn用來設定回上一頁按鈕(不加或沒有上一頁時，則不會顯示此按鈕)。id可以自己命名。此頁專用的javascript css放在這個div裡。-->
<script type="text/javascript">  //這頁專用的javascript語法，需包在page的div裡。

    $(document).ready(function(){  //這一行是指當整個網頁檔案都載入時，才會執行此function

	if(sessionStorage.getItem('memberid')==null){	//登入驗證 如果session memberid不存在 = 未登入

			document.location.href="login.html";// 未登入，回登入頁
		
	}else{	//登入驗證 如果session memberid存在 = 已登入
	
		var memberid = sessionStorage.getItem('memberid');	//接收登入login.html頁面，的會員主鍵memberid session
            
      $.ajax({  //用ajax接收
        url:'http://伺服器IP/app_php/coupon_collect.php?mid='+memberid+'',  //接收的php檔案網址，以GET方式傳送會員主鍵memberid，從資料庫撈取已收藏優惠券列表
        dataType:'jsonp',  //以jsonp方式接收
        jsonp:'jsoncallback',  //接收php檔案內jsoncallback的值
        timeout:5000,
        success:function(data,status){  //成功時跑的function
          $.each(data,function(i,item){ //用迴圈逐一傳入物件各屬性的名稱(i),及值(item)給callback函數處理。其中item很重要，下面注意的地方會解釋。
		  
					//集券冊，一筆一筆顯示優惠	
		  
			var out='<li><a href="../bi/coupon_context.html" onclick="pagesend('+item.coupon_id+')">'  //設定out變數的內容。注意：item.資料庫欄位名稱(如name)，就會把name欄位的值加進來(欄位名稱需在php檔中，有從資料庫撈出來的才有用)。+是連接符號，和java一樣，這邊+號這麼多是在設定它顯示的方式。
				+'<img src="'+item.pic+'" height="200%" width="150%" />' //這邊都是jquery-mobile的語法，下方ul中需要包li，其他標籤為每個li裡的標籤
				+'<h2>'+item.title+'</h2>' //優惠券標題欄位
				+'<p>優惠商家:'+item.name+'</p>'  //優惠店家欄位
				+'<p>優惠開始日期:'+item.timestart+'</p>'  //優惠開始日期欄位
				+'<p>優惠結束日期:'+item.timeend+'</p>'  //優惠結束日期欄位
				+'</a><a href="delete_coupon.html" onclick="deletecoupon('+item.coupon_id+')" data-rel="dialog" data-transition="pop">刪除收藏</a>'  //刪除已收藏優惠券按鈕，按下時觸發deletecoupon() function，設定想刪除的優惠券主鍵
			    +'</li>';
            
			$('#couponcollect').append(out);   //#couponcollect是找id為couponcollect的標籤(下方有個ul標籤的id為couponcollect)。.append(out)是把out的內容接到id為couponcollect的標籤裡     
          });
		  $('#couponcollect').listview('refresh');//上方加入多個li後，需要重整頁面才會正常顯示，這行一定要有。
        },
        error:function(){ //錯誤時跑的function
        couponcollect.text('There was an error loading the data.');  //出錯時顯示的文字
        }
      });


	}	//else結尾
	


    });
	
	function pagesend(cid){
		sessionStorage.setItem('cid',cid);	//設定優惠券主鍵cid session，供優惠券內容coupon_context.html，從資料庫撈取優惠券內容使用
		//localStorage.setItem("tid",sid);
		}

	function deletecoupon(deletecoupon){
		sessionStorage.setItem('deletecoupon',deletecoupon);	//設定想刪除的已收藏優惠券主鍵 deletecoupon session，供刪除已收藏優惠券delete_coupon.html，刪除已收藏優惠券功能使用
		//localStorage.setItem("tid",sid);
		}

		




</script>  <!--這頁專用的javascript語法結尾-->
	
  <div data-role="header"   data-position="fixed"><!--上方區塊div-->

    <h1>集券冊</h1> <!--固定要用h1-->

  </div><!--上方區塊結束-->
  
  <div data-role="content"><!--中間區塊div (程式主要內容)-->

	<p>搜尋優惠券：</p>

    <div>  
      <ul id="couponcollect" data-role="listview" data-filter="true" data-split-icon="delete" data-split-theme="d"> <!--id為couponcollect的標籤，其他屬性設定是jquery-mobile的列表語法-->
      
      </ul>  <!--id為couponcollect的標籤結尾-->   
    </div> 
    
  
  </div><!--中間區塊結束-->
  
  <div data-role="footer" data-position="fixed"><!--下方區塊div-->


	


    <h4><a href="logout.html" data-role="button" data-theme="a">登出</a></h4> <!--固定要用h4-->

  </div><!--下方區塊結束-->
  
</div> 

</body>
</html>
